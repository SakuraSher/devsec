name: PR Checks
on:
   pull_request:
      branches:
         - main
      paths:
            - 'part1/**'
   workflow_dispatch:


jobs:
   infra-scan:
      runs-on: ubuntu-latest
      steps:
         - name: check out code
           uses: actions/checkout@v4
         - name: check current directory
           run: |
              pwd
              ls -la
              echo "Part1 contents:"
              find ./part1 -type f
              echo "Part2 contents:"
              find ./part2 -type f
         - name: Install Checkov
           run: pip install checkov

         - name: Run Terraform scan
           run: |
             echo "Scanning directory: $(realpath ./part1)"
             checkov -d ./part1 --framework terraform --quiet
         - name: Setup TF Lint
           uses: terraform-linters/setup-tflint@v6
           
         - name: Run TFLint
           run: |
               tflint --init
               tflint --recursive --chdir=./part1
           
   
   docker-scan:
      runs-on: ubuntu-latest
      steps:
         - name: check out code
           uses: actions/checkout@v4
         - name: hadolint scan
           uses: hadolint/hadolint-action@v3.3.0
           with:
              dockerfile: ./part1/Dockerfile
         - name: Build image
           run: |
                docker buildx build  \
                --load \
                -t image:${{ github.sha }} ./part1
         - name: Scan image with Trivy
           uses: aquasecurity/trivy-action@v0.9.0
           with:
              image-ref: image:{{ github.sha }}
              format: 'table'
              vuln-type: 'os,library'
              level: 'CRITICAL,HIGH'
              exit-code: '1'
       
