name: PR Checks
on:
   pull_request:
      branches:
         - main
      paths:
            - 'part1/**'
   workflow_dispatch:


jobs:
   infra-scan:
      runs-on: ubuntu-latest
      steps:
         - name: check out code
           uses: actions/checkout@v4
         - name: Run checkov Scan
           uses: bridgecrewio/checkov-action@v2
           with:
              directory: ./part1
              framework: terraform
              output_format: cli,json,sarif
              output_file_path: console,results.sarif,results.json
              quiet: true
              skip_check: CKV_DOCKER_2,CKV_DOCKER_3,CKV_AWS_130,CKV_AWS_23,CKV_AWS_260,CKV_AWS_382,CKV_AWS_23,CKV_AWS_150,CKV_AWS_131,CKV_AWS_91,CKV_AWS_2,CKV_AWS_158,CKV_AWS_338,CKV_AWS_65,CKV_AWS_333,CKV_AWS_130,CKV2_AWS_12,CKV2_AWS_20,CKV_AWS_103,CKV2_AWS_11,CKV_AWS_378,CKV2_AWS_28,CKV_AWS_18,CKV2_GHA_1